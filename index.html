<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pill Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        /* Hide scrollbar for day circles */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden flex flex-col items-center justify-center">

    <!-- Toast Notification (Replaces native alerts) -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[60] transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none flex justify-center w-full max-w-sm px-4">
        <div id="toast-message" class="bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl text-sm font-medium text-center tracking-wide shadow-slate-900/20"></div>
    </div>

    <!-- Main Mobile Container -->
    <div class="w-full max-w-md h-full bg-white shadow-xl relative overflow-hidden flex flex-col sm:h-[90vh] sm:rounded-3xl sm:border border-slate-200">
        
        <!-- Header -->
        <header class="bg-blue-600 text-white p-5 shadow-md flex items-center justify-between z-10 shrink-0">
            <div class="flex items-center gap-2">
                <span class="text-2xl">💊</span>
                <h1 class="text-xl font-bold tracking-wide">Pill Tracker</h1>
            </div>
            <div id="progress-indicator" class="hidden text-sm font-medium bg-blue-700 px-3 py-1 rounded-full">
                ✅ 0%
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto overflow-x-hidden relative" id="main-content">
            
            <!-- Setup View -->
            <div id="setup-view" class="p-6 hidden animate-[fadeIn_0.3s_ease-out]">
                <div class="mb-6 text-center">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4 text-3xl">
                        💊
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">Initial Setup ⚙️</h2>
                    <p class="text-slate-500 text-sm mt-1">Configure your medication schedule.</p>
                </div>

                <form id="setup-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">📅 Duration (Days)</label>
                        <input type="number" id="input-days" min="1" max="365" value="7" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg" placeholder="e.g. 7">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">💊 Times per Day</label>
                        <input type="number" id="input-times" min="1" max="12" value="4" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg" placeholder="e.g. 4">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">☀️ Wake Up Time</label>
                            <input type="time" id="input-wake" value="08:00" required
                                class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg text-center">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">🌙 Sleep Time</label>
                            <input type="time" id="input-sleep" value="22:00" required
                                class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg text-center">
                        </div>
                    </div>

                    <div>
                        <label for="input-first-intake" class="block text-sm font-medium text-slate-700 mb-1">⏰ First Intake (Day 1)</label>
                        <select id="input-first-intake"
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-base font-medium text-slate-800">
                        </select>
                        <p id="schedule-preview-text" class="text-xs text-slate-500 mt-2 bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 leading-relaxed"></p>
                    </div>

                    <div id="setup-error" class="hidden text-red-500 text-sm font-medium bg-red-50 p-3 rounded-lg"></div>

                    <button type="submit" 
                        class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg shadow-blue-200 transition-transform active:scale-[0.98] text-lg">
                        🚀 Start Schedule
                    </button>
                </form>
            </div>

            <!-- Tracker View -->
            <div id="tracker-view" class="hidden animate-[fadeIn_0.3s_ease-out] pb-24">
                
                <!-- Day Circles Nav (Sticky) -->
                <div class="sticky top-0 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm z-20">
                    <div id="day-circles-container" class="flex overflow-x-auto p-4 gap-3 snap-x hide-scrollbar items-center">
                        <!-- Circles injected here via JS -->
                    </div>
                </div>

                <!-- Current Day View -->
                <div id="current-day-view" class="p-4 space-y-4">
                    <!-- Day header & slots injected here via JS -->
                </div>

                <!-- Reset Section -->
                <div class="p-4 mt-4 border-t border-slate-200 bg-slate-50">
                    <button id="btn-reset" class="w-full flex items-center justify-center gap-2 py-4 px-4 bg-white border-2 border-red-100 text-red-600 hover:bg-red-50 rounded-xl font-bold transition-colors active:scale-[0.98]">
                        ⚙️ Reset & Start Over
                    </button>
                    <p class="text-xs text-center text-slate-400 mt-3">Resetting will permanently delete current progress.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Custom Confirmation Modal (Replaces confirm()) -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 hidden items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-300" id="confirm-modal-box">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-2xl">
                    ⚠️
                </div>
                <div>
                    <h3 class="text-lg font-bold text-slate-900">Are you absolutely sure?</h3>
                </div>
            </div>
            <p class="text-slate-500 mb-6 text-sm leading-relaxed">
                This will erase all your tracking records and current schedule. You will need to setup a new plan. This action cannot be undone.
            </p>
            <div class="flex gap-3">
                <button id="btn-cancel-reset" class="flex-1 py-3 px-4 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-xl font-medium transition-colors">
                    Cancel
                </button>
                <button id="btn-confirm-reset" class="flex-1 py-3 px-4 bg-red-600 text-white hover:bg-red-700 rounded-xl font-medium transition-colors shadow-lg shadow-red-200">
                    Yes, Reset App
                </button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'pillTrackerAppData';
        
        // App State
        let appData = null;
        let selectedDayIndex = 0;
        let toastTimeout = null;

        // DOM Elements
        const setupView = document.getElementById('setup-view');
        const trackerView = document.getElementById('tracker-view');
        const setupForm = document.getElementById('setup-form');
        const setupError = document.getElementById('setup-error');
        const inputDays = document.getElementById('input-days');
        const inputTimes = document.getElementById('input-times');
        const inputWake = document.getElementById('input-wake');
        const inputSleep = document.getElementById('input-sleep');
        const inputFirstIntake = document.getElementById('input-first-intake');
        const schedulePreviewText = document.getElementById('schedule-preview-text');
        const dayCirclesContainer = document.getElementById('day-circles-container');
        const currentDayView = document.getElementById('current-day-view');
        const progressIndicator = document.getElementById('progress-indicator');
        
        // Modal Elements
        const confirmModal = document.getElementById('confirm-modal');
        const confirmModalBox = document.getElementById('confirm-modal-box');
        const btnReset = document.getElementById('btn-reset');
        const btnCancelReset = document.getElementById('btn-cancel-reset');
        const btnConfirmReset = document.getElementById('btn-confirm-reset');

        // Toast Notification Helper
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const msgEl = document.getElementById('toast-message');
            msgEl.textContent = message;
            container.classList.remove('translate-y-20', 'opacity-0');
            container.classList.add('translate-y-0', 'opacity-100');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                container.classList.add('translate-y-20', 'opacity-0');
                container.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }

        // Save State to LocalStorage
        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            } catch (err) {
                console.error('Failed to save data:', err);
                showToast('⚠️ Unable to save progress locally.');
            }
        }

        // Initialize App on Load
        function initApp() {
            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                if (storedData) {
                    appData = JSON.parse(storedData);
                    // Migrate legacy schedule format if present so existing user progress is preserved
                    if (appData && appData.config && !appData.daysSchedule && Array.isArray(appData.schedule) && Array.isArray(appData.times)) {
                        appData.daysSchedule = appData.schedule.map(dayArr =>
                            dayArr.map((taken, idx) => ({
                                time: appData.times[idx],
                                taken: Boolean(taken)
                            }))
                        );
                        saveData();
                    }

                    if (appData && appData.config && Array.isArray(appData.daysSchedule) && appData.daysSchedule.length > 0) {
                        const totalScheduleDays = appData.daysSchedule.length;

                        // Determine current day index based on startDate
                        if (appData.config.startDate) {
                            const start = new Date(appData.config.startDate);
                            start.setHours(0, 0, 0, 0);
                            const today = new Date();
                            today.setHours(0, 0, 0, 0);
                            const diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24));
                            if (diffDays >= 0 && diffDays < totalScheduleDays) {
                                selectedDayIndex = diffDays;
                            }
                        }

                        // Auto-jump past already completed days
                        while (
                            selectedDayIndex < totalScheduleDays - 1 &&
                            appData.daysSchedule[selectedDayIndex] &&
                            appData.daysSchedule[selectedDayIndex].every(slot => slot.taken)
                        ) {
                            selectedDayIndex++;
                        }

                        showTrackerView();
                        return;
                    }
                }
            } catch (err) {
                console.error('Error loading stored data:', err);
            }
            showSetupView();
        }

        // View Switchers
        function showSetupView() {
            setupView.classList.remove('hidden');
            trackerView.classList.add('hidden');
            progressIndicator.classList.add('hidden');
            updateFirstIntakeOptions();
        }

        function showTrackerView() {
            setupView.classList.add('hidden');
            trackerView.classList.remove('hidden');
            progressIndicator.classList.remove('hidden');
            renderSchedule();
            updateProgress();

            requestAnimationFrame(() => {
                const activeCircle = document.querySelector(`[data-day-index="${selectedDayIndex}"]`);
                if (activeCircle) {
                    activeCircle.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
                }
            });
        }

        // Calculate Evenly Spaced Timeslots between Wake Up and Sleep Time
        function calculateTimeslots(wakeStr, sleepStr, count) {
            const [wakeH, wakeM] = wakeStr.split(':').map(Number);
            const [sleepH, sleepM] = sleepStr.split(':').map(Number);

            const wakeMinutes = wakeH * 60 + wakeM;
            let sleepMinutes = sleepH * 60 + sleepM;

            // Handle sleep time past midnight (e.g., wake 08:00, sleep 01:00)
            if (sleepMinutes <= wakeMinutes) {
                sleepMinutes += 24 * 60;
            }

            if (count === 1) {
                return [wakeStr];
            }

            const totalSpan = sleepMinutes - wakeMinutes;
            const interval = totalSpan / (count - 1);
            const slots = [];

            for (let i = 0; i < count; i++) {
                const currentTotalMins = Math.round(wakeMinutes + i * interval) % (24 * 60);
                const hh = String(Math.floor(currentTotalMins / 60)).padStart(2, '0');
                const mm = String(currentTotalMins % 60).padStart(2, '0');
                slots.push(`${hh}:${mm}`);
            }

            return slots;
        }

        // Format 24h "HH:MM" into 12h "h:MM AM/PM"
        function formatTime12Hour(time24) {
            const [hourStr, minuteStr] = time24.split(':');
            let hour = parseInt(hourStr, 10);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12 || 12;
            return `${hour}:${minuteStr} ${ampm}`;
        }

        // Get Time-of-Day Emoji for a 24h "HH:MM" string
        function getTimeEmoji(time24) {
            const hour = parseInt(time24.split(':')[0], 10);
            if (hour >= 5 && hour < 8) return '🌅';   // Sunrise
            if (hour >= 8 && hour < 12) return '🌤️';  // Morning
            if (hour >= 12 && hour < 17) return '☀️'; // Noon / Afternoon
            if (hour >= 17 && hour < 20) return '🌇'; // Sunset
            if (hour >= 20 && hour < 24) return '🌙'; // Night
            return '🌌';                              // Late Night (00:00 - 04:59)
        }

        // Dynamically populate First Intake dropdown & schedule breakdown preview
        function updateFirstIntakeOptions() {
            const days = parseInt(inputDays.value, 10);
            const times = parseInt(inputTimes.value, 10);
            const wakeTime = inputWake.value;
            const sleepTime = inputSleep.value;

            if (isNaN(times) || times < 1 || times > 12 || !wakeTime || !sleepTime) {
                inputFirstIntake.innerHTML = '<option value="0">Dose #1 (Wake up)</option>';
                schedulePreviewText.textContent = 'Enter valid times above to preview your daily intake slots.';
                return;
            }

            const previousSelection = parseInt(inputFirstIntake.value, 10);
            const slots = calculateTimeslots(wakeTime, sleepTime, times);

            inputFirstIntake.innerHTML = '';
            slots.forEach((slotTime, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                const emoji = getTimeEmoji(slotTime);
                const formatted = formatTime12Hour(slotTime);
                const dosesOnDay1 = times - idx;
                const suffix = idx === 0
                    ? `Full Day 1 (${dosesOnDay1} ${dosesOnDay1 === 1 ? 'dose' : 'doses'})`
                    : `${dosesOnDay1} ${dosesOnDay1 === 1 ? 'dose' : 'doses'} left on Day 1`;
                option.textContent = `${emoji} ${formatted} — Dose #${idx + 1} (${suffix})`;
                inputFirstIntake.appendChild(option);
            });

            if (!isNaN(previousSelection) && previousSelection >= 0 && previousSelection < times) {
                inputFirstIntake.value = previousSelection;
            } else {
                inputFirstIntake.value = 0;
            }

            const selectedStartIdx = parseInt(inputFirstIntake.value, 10) || 0;
            const validDays = !isNaN(days) && days >= 1 ? days : 1;
            const totalDoses = validDays * times;
            const day1Doses = times - selectedStartIdx;
            const remainingDoses = totalDoses - day1Doses;
            const fullDaysLeft = Math.floor(remainingDoses / times);
            const extraDosesLeft = remainingDoses % times;

            if (selectedStartIdx === 0) {
                schedulePreviewText.textContent = `📋 Total: ${totalDoses} doses across ${validDays} ${validDays === 1 ? 'day' : 'days'} (${times}/day starting at ${formatTime12Hour(slots[0])}).`;
            } else {
                let remainderText = '';
                if (fullDaysLeft > 0 && extraDosesLeft > 0) {
                    remainderText = `${fullDaysLeft} full ${fullDaysLeft === 1 ? 'day' : 'days'} + ${extraDosesLeft} ${extraDosesLeft === 1 ? 'dose' : 'doses'} on Day ${fullDaysLeft + 2}`;
                } else if (fullDaysLeft > 0) {
                    remainderText = `${fullDaysLeft} full ${fullDaysLeft === 1 ? 'day' : 'days'}`;
                } else {
                    remainderText = `${extraDosesLeft} ${extraDosesLeft === 1 ? 'dose' : 'doses'} on Day 2`;
                }
                schedulePreviewText.textContent = `📋 Day 1: ${day1Doses} ${day1Doses === 1 ? 'dose' : 'doses'} (from ${formatTime12Hour(slots[selectedStartIdx])}), leaving ${remainderText} (${totalDoses} doses total).`;
            }
        }

        [inputDays, inputTimes, inputWake, inputSleep].forEach(el => {
            el.addEventListener('input', updateFirstIntakeOptions);
            el.addEventListener('change', updateFirstIntakeOptions);
        });
        inputFirstIntake.addEventListener('change', updateFirstIntakeOptions);

        // Sequential Check Validation (Cannot skip ahead or untick out of order)
        function canToggleSlot(dayIdx, slotIdx, currentlyTicked) {
            const daySlots = appData.daysSchedule[dayIdx];
            if (!currentlyTicked) {
                // To tick: previous slot must be ticked (or this is the first slot of the day)
                return slotIdx === 0 || daySlots[slotIdx - 1].taken === true;
            } else {
                // To untick: next slot must NOT be ticked (or this is the last slot of the day)
                return slotIdx === daySlots.length - 1 || daySlots[slotIdx + 1].taken === false;
            }
        }

        // Get formatted date for a specific day offset
        function getDateForDay(dayIndex) {
            const baseDate = appData.config.startDate ? new Date(appData.config.startDate) : new Date();
            baseDate.setHours(0, 0, 0, 0);
            const targetDate = new Date(baseDate);
            targetDate.setDate(baseDate.getDate() + dayIndex);
            return targetDate;
        }

        // Render Day Circles and Active Day Schedule
        function renderSchedule() {
            dayCirclesContainer.innerHTML = '';
            currentDayView.innerHTML = '';

            const totalDays = appData.daysSchedule.length;

            // 1. Render Top Day Circles
            for (let dayIndex = 0; dayIndex < totalDays; dayIndex++) {
                const dayDate = getDateForDay(dayIndex);
                const shortDate = dayDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const isDayDone = appData.daysSchedule[dayIndex].every(slot => slot.taken);
                const isSelected = dayIndex === selectedDayIndex;

                const circleBtn = document.createElement('button');
                circleBtn.dataset.dayIndex = dayIndex;
                circleBtn.className = `relative flex flex-col items-center justify-center min-w-[74px] h-[74px] rounded-full border-2 snap-center transition-all shrink-0 focus:outline-none ${
                    isSelected
                        ? (isDayDone
                            ? 'border-green-500 bg-green-50 shadow-md scale-105'
                            : 'border-blue-600 bg-blue-50 shadow-md scale-105')
                        : (isDayDone
                            ? 'border-green-300 bg-green-50/60 hover:border-green-400 active:scale-95'
                            : 'border-slate-200 bg-white hover:border-blue-300 active:scale-95')
                }`;

                circleBtn.innerHTML = `
                    <span class="text-xs font-bold ${
                        isSelected
                            ? (isDayDone ? 'text-green-700' : 'text-blue-700')
                            : (isDayDone ? 'text-green-600' : 'text-slate-700')
                    }">
                        ${isDayDone ? '✅' : ''} Day ${dayIndex + 1}
                    </span>
                    <span class="text-[11px] font-medium mt-0.5 ${
                        isSelected ? 'text-slate-700' : 'text-slate-400'
                    }">
                        ${shortDate}
                    </span>
                `;

                circleBtn.addEventListener('click', () => {
                    selectedDayIndex = dayIndex;
                    renderSchedule();
                    circleBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                });

                dayCirclesContainer.appendChild(circleBtn);
            }

            // 2. Render Selected Day Header & Timeslots
            const selectedDate = getDateForDay(selectedDayIndex);
            const fullDateStr = selectedDate.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
            const daySlots = appData.daysSchedule[selectedDayIndex];
            const completedToday = daySlots.filter(slot => slot.taken).length;
            const totalToday = daySlots.length;
            const isAllCompletedToday = completedToday === totalToday;

            const dayHeader = document.createElement('div');
            dayHeader.className = 'flex items-center justify-between bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3';
            dayHeader.innerHTML = `
                <div>
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        📅 Day ${selectedDayIndex + 1}
                        ${isAllCompletedToday ? '<span class="text-xs bg-green-100 text-green-700 px-2.5 py-0.5 rounded-full font-semibold">Completed 🎉</span>' : ''}
                    </h2>
                    <p class="text-xs font-medium text-slate-500 mt-0.5">${fullDateStr}</p>
                </div>
                <div class="text-right">
                    <span class="inline-block text-xs font-bold px-3 py-1.5 rounded-xl ${
                        isAllCompletedToday ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'
                    }">
                        ${completedToday} / ${totalToday} Taken
                    </span>
                </div>
            `;
            currentDayView.appendChild(dayHeader);

            const slotsContainer = document.createElement('div');
            slotsContainer.className = 'space-y-3';

            daySlots.forEach((slotObj, slotIndex) => {
                const timeSlot = slotObj.time;
                const isTicked = slotObj.taken;
                const isActionable = canToggleSlot(selectedDayIndex, slotIndex, isTicked);

                const slotBtn = document.createElement('button');
                slotBtn.type = 'button';
                slotBtn.className = `w-full flex items-center justify-between p-4 rounded-2xl border-2 transition-all duration-200 ${
                    isTicked
                        ? 'border-green-500 bg-green-50/70 text-green-900 shadow-sm'
                        : isActionable
                            ? 'border-blue-200 bg-white hover:border-blue-400 text-slate-800 shadow-sm active:scale-[0.99]'
                            : 'border-slate-200 bg-slate-50/70 text-slate-400 opacity-75'
                }`;

                slotBtn.innerHTML = `
                    <div class="flex items-center gap-3.5">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-colors ${
                            isTicked
                                ? 'bg-green-500 text-white shadow-sm'
                                : isActionable
                                    ? 'border-2 border-blue-400 bg-blue-50 text-blue-600'
                                    : 'border-2 border-slate-300 bg-slate-100 text-slate-400'
                        }">
                            ${isTicked ? '✓' : (isActionable ? (slotIndex + 1) : '🔒')}
                        </div>
                        <div class="flex flex-col items-start">
                            <span class="font-bold text-xl flex items-center gap-2 ${isTicked ? 'line-through opacity-80' : ''}">
                                <span>${getTimeEmoji(timeSlot)}</span>
                                <span>${formatTime12Hour(timeSlot)}</span>
                            </span>
                            <span class="text-xs font-medium ${isTicked ? 'text-green-600' : 'text-slate-400'}">
                                Dose #${slotIndex + 1} of ${totalToday}
                            </span>
                        </div>
                    </div>
                    <span class="text-sm font-bold tracking-wide px-3 py-1.5 rounded-xl ${
                        isTicked
                            ? 'bg-green-100 text-green-700'
                            : isActionable
                                ? 'bg-blue-50 text-blue-600'
                                : 'text-slate-400'
                    }">
                        ${isTicked ? 'TAKEN 💊' : (isActionable ? 'TAKE 💊' : 'LOCKED')}
                    </span>
                `;

                slotBtn.addEventListener('click', () => {
                    if (!canToggleSlot(selectedDayIndex, slotIndex, isTicked)) {
                        if (!isTicked) {
                            showToast('⚠️ Please take your previous pill first!');
                        } else {
                            showToast('⚠️ Cannot untick. Next pill is already taken!');
                        }
                        slotBtn.classList.add('animate-[shake_0.25s_ease-in-out]');
                        setTimeout(() => slotBtn.classList.remove('animate-[shake_0.25s_ease-in-out]'), 250);
                        return;
                    }

                    const newTickState = !appData.daysSchedule[selectedDayIndex][slotIndex].taken;
                    appData.daysSchedule[selectedDayIndex][slotIndex].taken = newTickState;
                    saveData();
                    renderSchedule();
                    updateProgress();

                    // Auto-jump to next day if current day's schedule is now completed
                    if (newTickState && appData.daysSchedule[selectedDayIndex].every(slot => slot.taken)) {
                        if (selectedDayIndex < appData.daysSchedule.length - 1) {
                            const completedDayIdx = selectedDayIndex;
                            const nextDayIdx = selectedDayIndex + 1;
                            showToast(`🎉 Day ${completedDayIdx + 1} completed! Moving to Day ${nextDayIdx + 1}...`);

                            setTimeout(() => {
                                if (selectedDayIndex === completedDayIdx && appData.daysSchedule[selectedDayIndex].every(slot => slot.taken)) {
                                    selectedDayIndex = nextDayIdx;
                                    renderSchedule();
                                    const nextCircle = document.querySelector(`[data-day-index="${selectedDayIndex}"]`);
                                    if (nextCircle) {
                                        nextCircle.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                                    }
                                }
                            }, 550);
                        } else {
                            showToast('🎊 Congratulations! All days completed!');
                        }
                    }
                });

                slotsContainer.appendChild(slotBtn);
            });

            currentDayView.appendChild(slotsContainer);
        }

        // Update Overall Header Progress Badge
        function updateProgress() {
            if (!appData || !appData.daysSchedule) return;
            let total = 0;
            let completed = 0;
            appData.daysSchedule.forEach(daySlots => {
                daySlots.forEach(slot => {
                    total++;
                    if (slot.taken) completed++;
                });
            });
            const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
            progressIndicator.textContent = `✅ ${pct}%`;
        }

        // Setup Form Submission
        setupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            setupError.classList.add('hidden');

            const days = parseInt(inputDays.value, 10);
            const times = parseInt(inputTimes.value, 10);
            const wakeTime = inputWake.value;
            const sleepTime = inputSleep.value;
            const firstIntakeIndex = parseInt(inputFirstIntake.value, 10) || 0;

            if (isNaN(days) || days < 1 || days > 365) {
                setupError.textContent = '⚠️ Please enter a valid number of days (1 - 365).';
                setupError.classList.remove('hidden');
                return;
            }
            if (isNaN(times) || times < 1 || times > 12) {
                setupError.textContent = '⚠️ Please enter a valid number of times per day (1 - 12).';
                setupError.classList.remove('hidden');
                return;
            }
            if (!wakeTime || !sleepTime) {
                setupError.textContent = '⚠️ Please select both wake up and sleep times.';
                setupError.classList.remove('hidden');
                return;
            }
            if (firstIntakeIndex < 0 || firstIntakeIndex >= times) {
                setupError.textContent = '⚠️ Please select a valid first intake time.';
                setupError.classList.remove('hidden');
                return;
            }

            const dailyTimeslots = calculateTimeslots(wakeTime, sleepTime, times);
            const totalDoses = days * times;
            const daysSchedule = [];

            // Day 1 starts from the chosen first intake slot
            const day1Times = dailyTimeslots.slice(firstIntakeIndex);
            daysSchedule.push(day1Times.map(time => ({ time, taken: false })));

            // Distribute remaining doses across subsequent days
            let remainingDoses = totalDoses - day1Times.length;
            while (remainingDoses > 0) {
                const count = Math.min(times, remainingDoses);
                const sliceTimes = dailyTimeslots.slice(0, count);
                daysSchedule.push(sliceTimes.map(time => ({ time, taken: false })));
                remainingDoses -= count;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            appData = {
                config: {
                    days,
                    timesPerDay: times,
                    wakeTime,
                    sleepTime,
                    firstIntakeIndex,
                    startDate: today.toISOString()
                },
                times: dailyTimeslots,
                daysSchedule
            };

            selectedDayIndex = 0;
            saveData();
            showTrackerView();
            showToast('🚀 Medication schedule created!');
        });

        // Custom Modal Handlers for Reset
        function openResetModal() {
            confirmModal.classList.remove('hidden');
            confirmModal.classList.add('flex');
            requestAnimationFrame(() => {
                confirmModal.classList.remove('opacity-0');
                confirmModalBox.classList.remove('scale-95');
                confirmModalBox.classList.add('scale-100');
            });
        }

        function closeResetModal() {
            confirmModal.classList.add('opacity-0');
            confirmModalBox.classList.remove('scale-100');
            confirmModalBox.classList.add('scale-95');
            setTimeout(() => {
                confirmModal.classList.add('hidden');
                confirmModal.classList.remove('flex');
            }, 300);
        }

        btnReset.addEventListener('click', openResetModal);
        btnCancelReset.addEventListener('click', closeResetModal);
        confirmModal.addEventListener('click', (e) => {
            if (e.target === confirmModal) closeResetModal();
        });

        btnConfirmReset.addEventListener('click', () => {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (err) {
                console.error('Failed to clear storage:', err);
            }
            appData = null;
            selectedDayIndex = 0;
            closeResetModal();
            showSetupView();
            showToast('🔄 Schedule reset. Ready for new setup.');
        });

        // Start App
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
